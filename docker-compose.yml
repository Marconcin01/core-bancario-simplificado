services:
  postgres:
    image: postgres:16-alpine
    container_name: core-bancario-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: core_bancario_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - core-bancario-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d core_bancario_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  core-bancario-pgdata:
