# ==============================
# Configuracao do servidor
# ==============================
server.port=8080

# ==============================
# Configuracao do banco PostgreSQL
# ==============================
# Ajuste host, porta, nome do banco, usuario e senha para o seu ambiente
spring.datasource.url=jdbc:postgresql://localhost:5432/core_bancario_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# Configuracao do JPA / Hibernate
# ==============================
# 'update' e adequado para desenvolvimento. Em producao, prefira migrations
# (Flyway/Liquibase) e o valor 'validate' ou 'none'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==============================
# Jackson / serializacao JSON
# ==============================
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
spring.jackson.default-property-inclusion=non_null

# ==============================
# Logging
# ==============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.renan.corebancario=DEBUG
